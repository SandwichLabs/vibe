version: 2

before:
  hooks:
    - cmd: npm ci
      dir: studio/frontend
    - cmd: npm run build
      dir: studio/frontend

builds:
  - id: vibe
    main: ./cmd/vibe
    binary: vibe
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/SandwichLabs/vibe/cmd.version={{.Version}}
      - -X github.com/SandwichLabs/vibe/cmd.commit={{.Commit}}
      - -X github.com/SandwichLabs/vibe/cmd.date={{.Date}}

  - id: vibe-studio
    main: ./studio
    binary: vibe-studio
    env:
      - CGO_ENABLED=1
    tags:
      - duckdb_arrow
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    overrides:
      - goos: linux
        goarch: amd64
        tags:
          - duckdb_arrow
          - webkit2_41
      - goos: linux
        goarch: arm64
        tags:
          - duckdb_arrow
          - webkit2_41

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
