name: CI

# Linux runs on every PR. macOS minutes cost 10x on a private repo, so the macOS
# smoke build runs only on push to main and on manual dispatch.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CGO_ENABLED: "1"
  # Keep the Wails CLI at the github.com/wailsapp/wails/v2 version in go.mod.
  WAILS_VERSION: v2.16.0
  # Build on 22.04 (glibc 2.35, webkit2gtk-4.1) so the Linux artifacts run on Ubuntu 22.04+, Debian 12+, Fedora 36+ (see docs/install.md).
  LINUX_TAGS: webkit2_41,duckdb_arrow

jobs:
  test:
    name: test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GOFLAGS: -tags=webkit2_41,duckdb_arrow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Install system packages (CGO DuckDB, WebKitGTK, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      # The Studio embeds frontend/dist, so build the frontend before any Go step that compiles ./studio.
      - name: Frontend install
        working-directory: studio/frontend
        run: npm ci

      - name: Frontend build
        working-directory: studio/frontend
        run: npm run build

      - name: Frontend tests (vitest)
        working-directory: studio/frontend
        run: npm test

      # Blocking: no unused export/type/file under src/{lib,composables,components,a2ui}
      # (knip pinned in package.json).
      - name: Frontend unused exports (knip)
        working-directory: studio/frontend
        run: npm run check:exports

      # Blocking (#54 slice 9b, F10 / O9): no .vue file over 600 lines, and no view with more than 150
      # script lines unless it is named in scripts/check-vue-size.mjs. Views wire composables and render.
      - name: Frontend view size
        working-directory: studio/frontend
        run: npm run check:vue-size

      # Blocking since #54 slice 9a (closes #34/#35): the binding types live in src/env.d.ts (AppApi).
      - name: typecheck (vue-tsc)
        working-directory: studio/frontend
        run: npm run typecheck

      # The connection leak tests expect the DuckDB postgres extension to be installed (it is on a dev
      # machine; a fresh runner reports extension-missing instead of server-changed). Install it into the
      # app-private extension dir the way `vibe conn test --install` does for a person.
      - name: Install the DuckDB postgres extension
        env:
          CI_PG_USER: ci
          CI_PG_PASSWORD: ci
        run: |
          go build -o "$RUNNER_TEMP/vibe" ./cmd/vibe
          ws="$(mktemp -d)"
          cd "$ws"
          "$RUNNER_TEMP/vibe" workspace init . </dev/null
          "$RUNNER_TEMP/vibe" conn add pg --type postgres --host 127.0.0.1 --port 1 --database x --sign-in env:CI_PG </dev/null
          # The connect itself is expected to fail; only the download matters.
          "$RUNNER_TEMP/vibe" conn test pg --install </dev/null || true
          find "$HOME/.cache/vibe/duckdb/extensions" -name 'postgres*.duckdb_extension' | grep .

      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck --severity=warning

      # The installer suite (#47) against fake archives built by the real scripts/package.sh, so a
      # packaging change can't silently break install.sh's tests.
      - name: Installer tests
        run: bash scripts/test-install.sh --native

      - name: go vet
        run: go vet ./...

      # xvfb-run gives TestStudio_Gui* a display; without one they panic.
      - name: go test
        run: xvfb-run -a go test -count=1 ./...

      # Blocking: functions unreachable from the CLI and Studio entry points must be on
      # scripts/deadcode-allow.txt (only With* seams, Mocks and a few justified others).
      - name: deadcode
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
          scripts/check-deadcode.sh

      # Blocking: import-graph layering (internal never imports cmd/studio; domain packages stay
      # below agents/llm/mcp/hub/tui; no cycles).
      - name: Layering
        run: scripts/check-layering.sh

      # Blocking: every exported App method needs a non-test frontend caller.
      - name: Wails binding usage
        run: scripts/check-bindings.sh

      # Blocking: no non-test Go file over 800 lines in studio/, cmd/ or internal/ unless it is on
      # scripts/filesize-waivers.txt (with a reason).
      - name: File size
        run: scripts/check-filesize.sh

      # Blocking: every exported App method is a thin binding (at most 25 statements counting nested
      # ones, no file, process, filestore-write or database/sql work of its own, no dot imports). The I/O half is also the ast-grep
      # rule thin-binding below; ast-grep cannot count statements, so this is a go/ast test.
      - name: Thin bindings
        run: xvfb-run -a go test -count=1 -run TestExportedAppMethodsAreThinBindings ./studio/

      # Blocking: the tools/ast-grep/sgconfig.yml rules at severity "error" (the ones already at zero:
      # one ParseScope, one path-containment helper, no find-connection-by-name loops, and from
      # slice 3 errors wrapped with %w, errors.Is not ==, no slog.Default().X calls). The
      # other rules are report-only until their slice lands.
      - name: ast-grep rules
        run: |
          npm install --global @ast-grep/cli@0.45.3
          ast-grep scan -c tools/ast-grep/sgconfig.yml cmd internal studio

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      # Blocking (#40). THIRD_PARTY_NOTICES.md is generated (task notices): go-licenses v2 over the CLI and
      # Studio for every release platform plus the production npm packages. Fails when a licence is not on the
      # permissive allow-list (the go-licenses check) or when the committed file is stale. Needs the frontend
      # install above (node_modules) and the build (the Studio embeds frontend/dist).
      - name: Third-party notices
        run: node scripts/gen-notices.mjs --check

      # Blocking (#41). A finding means a reachable vulnerability: bump the module or the Go patch
      # release. A finding with no fix gets a documented exception here, never a continue-on-error.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  build-smoke:
    name: build-smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macOS runs only on push to main and manual dispatch (10x minutes on a private repo).
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"linux-amd64","os":"ubuntu-22.04"},{"name":"linux-arm64","os":"ubuntu-22.04-arm"}]' || '[{"name":"linux-amd64","os":"ubuntu-22.04"},{"name":"linux-arm64","os":"ubuntu-22.04-arm"},{"name":"macos-arm64","os":"macos-15"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build the CLI
        run: task build

      - name: CLI round trip
        shell: bash
        run: |
          set -euo pipefail
          bin="$PWD/vibe"
          "$bin" --version
          dir="$(mktemp -d)"
          cd "$dir"
          "$bin" workspace init . --name ci-smoke </dev/null
          test -f vibe.yaml
          out="$("$bin" query "select 42 as answer" </dev/null)"
          echo "$out"
          grep -q 42 <<<"$out"

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build Studio (Linux)
        if: runner.os == 'Linux'
        working-directory: studio
        run: wails build -tags ${{ env.LINUX_TAGS }}

      # wails build regenerated src/wailsjs/go/main/App.d.ts: AppApi (env.d.ts) must match its arities (#54 9a).
      - name: AppApi matches the generated bindings
        if: runner.os == 'Linux'
        working-directory: studio/frontend
        run: node scripts/check-arity.mjs

      - name: Build Studio (macOS)
        if: runner.os == 'macOS'
        working-directory: studio
        run: wails build -tags duckdb_arrow

      - name: Check the Studio binary exists
        shell: bash
        run: ls -l studio/build/bin/
