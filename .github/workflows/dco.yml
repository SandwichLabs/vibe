name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          for sha in $(git log --no-merges --format=%H "${BASE_SHA}..${HEAD_SHA}"); do
            email="$(git log -1 --format=%aE "$sha")"
            case "$email" in
              *'[bot]@users.noreply.github.com')
                echo "skip bot ${sha:0:12}"
                continue
                ;;
            esac
            author="$(git log -1 --format='%aN <%aE>' "$sha")"
            if ! git log -1 --format=%B "$sha" | grep -Fxq "Signed-off-by: ${author}"; then
              echo "::error::Commit ${sha:0:12} is missing 'Signed-off-by: ${author}'"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Sign off with 'git commit -s' (fix: git rebase --signoff <base> and force-push)."
            echo "See https://developercertificate.org/ and CONTRIBUTING.md."
            exit 1
          fi
