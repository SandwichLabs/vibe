# Architecture rules from the #54 review (docs/reviews/arch-2026-10/).
# Run from the repo root:  ast-grep scan -c tools/ast-grep/sgconfig.yml cmd internal studio
# The rules' files:/ignores: globs are matched against paths relative to where you run it, so run it from the repo root.
# (Survey rules from the earlier cleanup live in docs/reviews/cleanup-2026-10/.)
ruleDirs:
  - rules
# .vue single-file components: scan their <script> blocks as TypeScript (ts rules apply to them).
languageGlobs:
  html: ["*.vue"]
languageInjections:
  - hostLanguage: html
    rule:
      pattern: <script $$$ATTRS>$CONTENT</script>
    injected: ts
