id: go-errorf-err-without-w
language: go
severity: error
message: fmt.Errorf formats an error with %v/%s (or .Error()) instead of %w, so errors.Is/As cannot see it (CLAUDE.md "wrap errors").
note: |
  ast-grep cannot type-check, so an error is recognised by name: an identifier or selector called err, e,
  why, cause, *Err or *err, or any .Error() call. Deliberate hiding (text redacted before it is shown)
  should be commented, and exempted by function name in this rule.
rule:
  kind: call_expression
  all:
    - has: {field: function, regex: '^fmt\.Errorf$'}
    - has:
        field: arguments
        has:
          any:
            - {kind: identifier, regex: '^(err|e|why|cause|[A-Za-z]*[Ee]rr)$'}
            - {kind: selector_expression, regex: '\.(err|e|cause|[A-Za-z]*[Ee]rr)$'}
            - {kind: call_expression, regex: '\.Error\(\)$'}
    - not: {has: {field: arguments, has: {kind: interpreted_string_literal, regex: '%w'}}}
ignores: ["**/*_test.go"]
