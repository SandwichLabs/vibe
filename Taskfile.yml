version: '3'

env:
  CGO_ENABLED: "1"

vars:
  BINARY: vibe
  # Wails CLI v2.11's package loader can't read Go 1.27 export data ("package ... without types"),
  # so the Wails tasks run on this toolchain (#92). An exported GOTOOLCHAIN in your shell wins.
  # Remove once a Wails release supports Go 1.27. Keep >= the `go` line in go.mod.
  WAILS_GOTOOLCHAIN: go1.26.3
  # `task install` stamps these into both binaries (release.yml stamps the same flags from the tag).
  INSTALL_DIR: '{{.HOME}}/go/bin'
  VERSION:
    sh: git describe --tags --always --dirty
  COMMIT:
    sh: git rev-parse --short HEAD
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  CLI_LDFLAGS: >-
    -s -w
    -X github.com/SandwichLabs/vibe/cmd.version={{.VERSION}}
    -X github.com/SandwichLabs/vibe/cmd.commit={{.COMMIT}}
    -X github.com/SandwichLabs/vibe/cmd.date={{.DATE}}
  STUDIO_LDFLAGS: >-
    -s -w
    -X main.version={{.VERSION}}
    -X main.commit={{.COMMIT}}
    -X main.date={{.DATE}}

tasks:
  default:
    desc: Lint, test, and build
    cmds:
      - task: lint
      - task: test
      - task: build

  mod:
    desc: Download and tidy Go modules
    cmds:
      - go mod download
      - go mod tidy

  build:
    desc: Build the vibe binary
    cmds:
      - go build -o {{.BINARY}} ./cmd/vibe

  test:
    desc: Run all tests (Go + Studio frontend)
    aliases: [t]
    cmds:
      - go test ./...
      - task: test:frontend

  test:frontend:
    desc: Run Studio frontend component tests (vitest)
    dir: studio/frontend
    cmds:
      - npm run test

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report written to coverage.html"

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  lint:fix:
    desc: Run golangci-lint with auto-fix
    cmds:
      - golangci-lint run --fix ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}}
      - rm -f coverage.out coverage.html

  studio:install:
    desc: Install studio frontend dependencies
    dir: studio/frontend
    cmds:
      - npm install

  studio:dev:
    desc: Run Vibe Studio in dev mode
    dir: studio
    env:
      GOTOOLCHAIN: '{{.WAILS_GOTOOLCHAIN}}'
    cmds:
      - wails dev -tags webkit2_41,duckdb_arrow

  build:all:
    desc: Build both CLI and Studio desktop app
    cmds:
      - task: build
      - task: studio:install
      - task: build:studio:linux

  build:studio:
    desc: Build Vibe Studio desktop app (macOS)
    dir: studio
    env:
      GOTOOLCHAIN: '{{.WAILS_GOTOOLCHAIN}}'
    cmds:
      - wails build

  build:studio:linux:
    desc: Build Vibe Studio desktop app (Linux)
    dir: studio
    env:
      GOTOOLCHAIN: '{{.WAILS_GOTOOLCHAIN}}'
    cmds:
      - wails build -tags webkit2_41

  install:
    desc: Versioned build of the vibe CLI and Vibe Studio into ~/go/bin (Linux)
    cmds:
      - task: install:cli
      - task: install:studio

  install:cli:
    desc: Versioned build of the vibe CLI into ~/go/bin
    cmds:
      - mkdir -p {{.INSTALL_DIR}}
      - go build -ldflags "{{.CLI_LDFLAGS}}" -o {{.INSTALL_DIR}}/{{.BINARY}} ./cmd/vibe
      - '{{.INSTALL_DIR}}/{{.BINARY}} --version'

  install:studio:
    desc: Versioned build of Vibe Studio into ~/go/bin (Linux; `vibe studio --gui` finds it beside vibe)
    platforms: [linux]
    dir: studio
    env:
      GOTOOLCHAIN: '{{.WAILS_GOTOOLCHAIN}}'
    cmds:
      - wails build -tags webkit2_41,duckdb_arrow -ldflags "{{.STUDIO_LDFLAGS}}"
      - mkdir -p {{.INSTALL_DIR}}
      - install -m 755 build/bin/vibe-studio {{.INSTALL_DIR}}/vibe-studio
      - '{{.INSTALL_DIR}}/vibe-studio --version'

  release:
    desc: How to cut a release (there is no local release; CI builds it)
    silent: true
    cmds:
      - |
        echo "A release is: push a tag. .github/workflows/release.yml builds every platform and"
        echo "creates a DRAFT release (tags with -rc or -test are prereleases); a human publishes it."
        echo "  git tag -a vX.Y.Z -m 'Release vX.Y.Z' && git push origin vX.Y.Z"
