id: go-path-containment-clone
language: go
severity: warning
message: Hand-rolled "is p inside root" check (filepath.Rel + ".." prefix). One owner (a pathsafe/filestore helper) should do containment; clones drift (see #137 U5).
rule:
  kind: function_declaration
  all:
    - has: {stopBy: end, kind: call_expression, has: {field: function, regex: '^filepath\.Rel$'}}
    - has: {stopBy: end, kind: interpreted_string_literal, regex: '^"\.\."$'}
ignores: ["**/*_test.go"]
